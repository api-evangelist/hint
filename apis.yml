aid: hint
name: Hint
description: >-
  Hint Inc. is a San Francisco based beverage company founded in 2005 by Kara Goldin, known for
  fruit-infused unsweetened water sold in still, sparkling, caffeinated and kids formats across
  25+ flavors. A large share of its business is direct-to-consumer through its own storefront at
  drinkhint.com, which runs on Shopify. Hint publishes no traditional developer program, SDKs or
  OpenAPI, but the storefront does expose a live, anonymous agent surface: an agents.md / llms.txt
  agent instruction document, a Universal Commerce Protocol (UCP) merchant profile at
  /.well-known/ucp, and a Model Context Protocol endpoint at /api/ucp/mcp that answers tools/list
  with 13 real catalog, cart, checkout and order tools. Checkout explicitly requires contemporaneous
  human approval before payment.
