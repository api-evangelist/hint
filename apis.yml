apis:
- name: Hint Agentic Commerce (UCP / MCP)
  description: >-
    The agent-facing commerce surface of the drinkhint.com storefront. Discovery is published at
    https://www.drinkhint.com/.well-known/ucp (Universal Commerce Protocol merchant profile,
    versions 2026-04-08 and 2026-01-23) and the callable surface is a Model Context Protocol
    endpoint at https://www.drinkhint.com/api/ucp/mcp. An anonymous tools/list returns 13 tools
    covering catalog search and lookup, product detail, cart create/update/cancel, checkout
    create/update/complete/cancel and order retrieval. The surface is provided natively by the
    Shopify platform for this merchant's own catalog and is served from Hint's own hosts.
  humanURL: https://www.drinkhint.com/agents.md
  baseURL: https://www.drinkhint.com/api/ucp/mcp
  tags:
  - Agentic Commerce
  - Model Context Protocol
  - Universal Commerce Protocol
  - Ecommerce
