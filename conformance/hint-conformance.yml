  name: Universal Commerce Protocol
  version: '2026-04-08'
  also_supported:
  - '2026-01-23'
  conforms: true
  evidence: >-
    https://www.drinkhint.com/.well-known/ucp returns HTTP 200 with ucp.version 2026-04-08,
    supported_versions, services["dev.ucp.shopping"] (transport mcp + embedded), and capabilities
    for dev.ucp.shopping.checkout, .fulfillment, .discount, .cart, .order, .catalog.search and
    .catalog.lookup, each naming its ucp.dev spec and JSON Schema.
  spec: https://ucp.dev/2026-04-08/specification/overview/
- id: mcp
  name: Model Context Protocol
  version: '2024-11-05'
  conforms: true
  evidence: >-
    initialize returned protocolVersion 2024-11-05 with serverInfo universal-commerce 0.1.0 and
    capabilities for tools, prompts, resources and logging; tools/list returned 13 tools with
    JSON Schema 2020-12 inputSchema.
- id: json-schema
  name: JSON Schema 2020-12
  conforms: true
  evidence: >-
    Every MCP tool inputSchema declares
    "$schema": "https://json-schema.org/draft/2020-12/schema".
- id: oauth2
  name: OAuth 2.0
  conforms: true
  evidence: >-
