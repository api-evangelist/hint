generated: '2026-08-22'
method: probed
source: >-
  https://www.drinkhint.com/.well-known/ucp, https://www.drinkhint.com/.well-known/openid-configuration,
  https://www.drinkhint.com/api/ucp/mcp (initialize + tools/list), https://www.drinkhint.com/agents.md
summary: >-
  Hint publishes no compliance or certification program of its own. What its hosts DO declare, in
  machine-readable form, is conformance to the agentic commerce standard stack: Universal Commerce
  Protocol, Model Context Protocol, and OAuth 2.0 / OpenID Connect for buyer identity.
standards:
