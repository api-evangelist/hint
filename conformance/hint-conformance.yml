- id: rfc8594
  name: RFC 8594 Sunset header
  conforms: false
  evidence: No Sunset or Deprecation headers observed; no deprecation policy published.
- id: llmstxt
  name: llms.txt
  conforms: true
  evidence: >-
    https://www.drinkhint.com/llms.txt returns HTTP 200 text/markdown, mirroring /agents.md, and is
