    set.
- id: pkce
  name: PKCE (RFC 7636)
  conforms: true
  evidence: code_challenge_methods_supported ["S256"] in the OIDC discovery document.
- id: rfc9457
  name: RFC 9457 Problem Details
  conforms: false
