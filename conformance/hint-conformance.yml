domain_standard:
  id: ucp
  name: Universal Commerce Protocol (dev.ucp.shopping)
  market: retail / direct-to-consumer commerce
  declared_in_contract: true
  evidence: >-
    The contract itself declares the standard: /.well-known/ucp names service namespace
    "dev.ucp.shopping" and capability namespaces dev.ucp.shopping.checkout / .cart / .fulfillment /
    .discount / .order / .catalog.search / .catalog.lookup, each bound to a published ucp.dev schema
    URL, plus the Shopify extension namespace dev.shopify.catalog. Payment handlers are declared by
    namespace too (com.google.pay, dev.shopify.card). An agent that already speaks UCP integrates
    with this store with no bespoke connector.
  note: >-
    The conformance is real and machine-verifiable, but it is delivered by the Shopify platform for
    this merchant rather than implemented by Hint. Recorded as what the contract says about itself.
