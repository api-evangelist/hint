summary: >-
  Hint publishes no API lifecycle policy of its own. The only versioning signal on its hosts is the
  dated protocol version negotiation carried by the UCP merchant profile and the MCP initialize
  handshake. There is no status page, no deprecation policy, no Sunset/Deprecation headers and no
  SLA on any Hint host.
