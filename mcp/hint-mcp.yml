raw_tools_list: mcp/hint-mcp-tools.json
tool_count: 13
tools:
- name: search_catalog
  category: catalog
  description: Search for products from the online store, hosted on Shopify.
- name: lookup_catalog
  category: catalog
  description: Look up multiple products or variants by identifier.
- name: get_product
  category: catalog
  description: Retrieve complete product detail by identifier. Returns a singular product.
- name: create_cart
  category: cart
  description: Creates a new cart.
- name: get_cart
  category: cart
  description: Get the cart contents.
- name: update_cart
  category: cart
  description: Perform updates to a cart.
- name: cancel_cart
  category: cart
  description: Cancels a cart.
- name: create_checkout
  category: checkout
  description: Creates a checkout; returns line items, totals, discounts and taxes.
- name: get_checkout
  category: checkout
  description: Returns details about the checkout, including line items, totals, discounts and taxes.
- name: update_checkout
  category: checkout
  description: Updates a checkout (buyer, fulfillment, discounts, payment instruments).
- name: complete_checkout
  category: checkout
  description: Completes a checkout and returns the checkout result. Requires buyer approval of payment.
- name: cancel_checkout
  category: checkout
  description: Cancels a checkout.
- name: get_order
  category: order
  description: Get the details of an order.
notes:
- Every tool requires a `meta.ucp-agent.profile` URI; calls without one are rejected with JSON-RPC
  error -32001 / invalid_profile_url (observed 2026-08-22, HTTP 422).
- Prices in responses are integers in ISO 4217 minor units paired with a currency code.
- The published agent instructions state checkout must not be completed without explicit,
  contemporaneous buyer approval, and point personal shopping agents at https://shop.app/SKILL.md.
