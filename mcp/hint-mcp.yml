name: Hint Storefront Agentic Commerce MCP
provider: Hint Inc.
summary: drinkhint.com serves a live Model Context Protocol endpoint for agent-driven commerce against
  Hint's own product catalog. It is reachable anonymously — an unauthenticated POST of {"jsonrpc":"2.0","id":1,"method":"tools/list"}
  returned HTTP 200 with 13 tools and full inputSchema for each on 2026-08-22. The server is provided
  natively by the Shopify platform (serverInfo.name "universal-commerce", version 0.1.0) implementing
  the Universal Commerce Protocol, and is served from Hint's own hosts against Hint's own catalog.
ownership_note: The endpoint is on Hint's own domain (www.drinkhint.com) and its mirror on the store's
  Shopify tenant (drinkhint.myshopify.com). The UCP merchant profile names merchant "drinkhint.com" with
  Shopify gateway merchant id 1430159418. This is Hint's storefront surface running on platform-provided
  software — the templated/self-hosted case — not a Hint-authored API product, and it is not a spec belonging
  to a different company.
