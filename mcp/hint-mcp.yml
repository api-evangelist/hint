  category: catalog
notes:
- Every tool requires a `meta.ucp-agent.profile` URI; calls without one are rejected with JSON-RPC error
  -32001 / invalid_profile_url (observed 2026-08-22, HTTP 422).
- Prices in responses are integers in ISO 4217 minor units paired with a currency code.
- The published agent instructions state checkout must not be completed without explicit, contemporaneous
  buyer approval, and point personal shopping agents at https://shop.app/SKILL.md.
